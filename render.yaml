# Pager Developer on Render: the API and Postgres (and optionally the console, which
# also deploys to Vercel). The worker runs on a Docker host: deploy/worker.
#
# Everything a workspace configures (repositories, Datadog, Slack, services) lives in
# the database and is set from the console. What is set here is the operator's: the
# GitHub App, the Slack app, the shared secrets, and optionally a fallback model key.
# `sync: false` values are asked for when the Blueprint is first applied; every name
# is documented in .env.example.
#
# Migrations run once per API deploy, before it starts (preDeployCommand). The worker
# does not migrate: deploy the API first when a release adds one. docs/launch.md is
# the whole sequence.

envVarGroups:
  # Generated once and shared. PAGER_SESSION_SECRET must be identical in the console
  # and the API; PAGER_MASTER_KEY in the API and the worker (it unwraps tenant
  # secrets), so copy it into the worker host's worker.env. Render generates 256
  # random bits, base64 — the 32 bytes the key needs.
  - name: pager-secrets
    envVars:
      - key: PAGER_SESSION_SECRET
        generateValue: true
      - key: PAGER_MASTER_KEY
        generateValue: true

databases:
  - name: pager-db
    postgresMajorVersion: "17"
    # Reachable from this account's services and, once added, the worker host only:
    #   ipAllowList:
    #     - source: <worker host IP>/32
    #       description: pager worker
    ipAllowList: []

services:
  # ── Console ──────────────────────────────────────────────────────────────────
  - type: web
    name: pager-web
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r --filter './packages/**' build && pnpm --filter @pager/web build
    startCommand: pnpm --filter @pager/web exec next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - fromGroup: pager-secrets
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # This service's own public URL, e.g. https://pager-web.onrender.com
      - key: AUTH_URL
        sync: false
      # The GitHub App's OAuth client (same values as GITHUB_APP_CLIENT_ID/SECRET).
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      # The API's URL, e.g. https://pager-api.onrender.com. Read at runtime.
      - key: PAGER_API_URL
        sync: false

  # ── API ──────────────────────────────────────────────────────────────────────
  - type: web
    name: pager-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r --filter './packages/**' build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @pager/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - fromGroup: pager-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: pager-db
          property: connectionString
      - key: PAGER_API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # The console's public URL: the only origin allowed to call the API from a
      # browser, and where GitHub and Slack send people back after installing.
      - key: PAGER_WEB_ORIGIN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false

  # ── Worker ───────────────────────────────────────────────────────────────────
  # Not on Render. The worker runs repository code, and open sign-up needs that code
  # in containers, which need a Docker daemon Render does not offer. It runs on a
  # Docker host instead: deploy/worker/compose.yaml. Add that host's IP to pager-db's
  # ipAllowList above so it can reach the database.
