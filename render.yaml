# Pager Developer on Render: the API, on Render's free instance type.
#
# The free beta costs nothing to host:
#   - console   Vercel (Hobby)                  apps/web
#   - API       here, free web service           spins down after 15 idle minutes; an
#                                                uptime monitor on /health keeps it awake
#                                                (one service uses ~744 of the 750 free
#                                                instance hours a month)
#   - database  Neon's free plan                 Render's free Postgres expires after 30 days
#   - worker    a machine you own, with Docker   deploy/worker
# docs/launch.md is the whole sequence.
#
# Everything a workspace configures lives in the database and is set from the console.
# What is set here is the operator's: the database URL, the GitHub App, the Slack app
# and the shared secrets. `sync: false` values are asked for when the Blueprint is
# first applied; every name is documented in .env.example.
#
# Free web services have no pre-deploy step, so migrations run as the API starts
# (a no-op when there is nothing new). The worker does not migrate.

envVarGroups:
  # Generated once. PAGER_SESSION_SECRET must be identical in the console (copy it to
  # Vercel) and the API; PAGER_MASTER_KEY in the API and the worker (it unwraps tenant
  # secrets), so copy it into the worker's worker.env. Render generates 256 random
  # bits, base64: the 32 bytes the key needs.
  - name: pager-secrets
    envVars:
      - key: PAGER_SESSION_SECRET
        generateValue: true
      - key: PAGER_MASTER_KEY
        generateValue: true

services:
  # ── Console ──────────────────────────────────────────────────────────────────
  # On Vercel (apps/web), not here. Its variables are listed in docs/launch.md.

  # ── API ──────────────────────────────────────────────────────────────────────
  - type: web
    name: pager-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r --filter './packages/**' build
    startCommand: pnpm db:migrate && pnpm --filter @pager/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - fromGroup: pager-secrets
      # Neon's connection string (it includes sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: PAGER_API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # Render's proxy sets X-Forwarded-For; webhooks are rate-limited by sender.
      - key: PAGER_TRUST_PROXY
        value: "1"
      # The console's public URL: the only origin allowed to call the API from a
      # browser, and where GitHub and Slack send people back after installing.
      - key: PAGER_WEB_ORIGIN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      # Paid plans are off in the free beta. To turn them on later, add
      # DODO_PAYMENTS_API_KEY, DODO_PAYMENTS_WEBHOOK_SECRET, DODO_PAYMENTS_ENVIRONMENT
      # and DODO_PRODUCT_TEAM here (docs/launch.md, "Taking payments"), and move the
      # console off Vercel Hobby, which is for non-commercial use only.

  # ── Worker ───────────────────────────────────────────────────────────────────
  # Not on Render: it runs repository code in Docker containers and must stay up to
  # poll; a free web service has no Docker. deploy/worker runs it.
