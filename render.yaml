# Pager Developer on Render: console (web), API, worker and Postgres.
#
# Everything a workspace configures (repositories, Datadog, Slack, services) lives in
# the database and is set from the console. What is set here is the operator's: the
# GitHub App, the Slack app, the shared secrets, and optionally a fallback model key.
# `sync: false` values are asked for when the Blueprint is first applied; every name
# is documented in .env.example.
#
# Migrations run once per API deploy, before it starts (preDeployCommand). The worker
# does not migrate: deploy the API first when a release adds one.

envVarGroups:
  # Generated once and shared. PAGER_SESSION_SECRET must be identical in the console
  # and the API; PAGER_MASTER_KEY in the API and the worker (it unwraps tenant
  # secrets). Render generates 256 random bits, base64 — the 32 bytes the key needs.
  - name: pager-secrets
    envVars:
      - key: PAGER_SESSION_SECRET
        generateValue: true
      - key: PAGER_MASTER_KEY
        generateValue: true

databases:
  - name: pager-db
    postgresMajorVersion: "17"
    # Reachable only from this account's services, never the public internet.
    ipAllowList: []

services:
  # ── Console ──────────────────────────────────────────────────────────────────
  - type: web
    name: pager-web
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r --filter './packages/**' build && pnpm --filter @pager/web build
    startCommand: pnpm --filter @pager/web exec next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - fromGroup: pager-secrets
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # This service's own public URL, e.g. https://pager-web.onrender.com
      - key: AUTH_URL
        sync: false
      # The GitHub App's OAuth client (same values as GITHUB_APP_CLIENT_ID/SECRET).
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      # The API's URL, e.g. https://pager-api.onrender.com. Read at runtime.
      - key: PAGER_API_URL
        sync: false

  # ── API ──────────────────────────────────────────────────────────────────────
  - type: web
    name: pager-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r --filter './packages/**' build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @pager/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - fromGroup: pager-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: pager-db
          property: connectionString
      - key: PAGER_API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # The console's public URL: the only origin allowed to call the API from a
      # browser, and where GitHub and Slack send people back after installing.
      - key: PAGER_WEB_ORIGIN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false

  # ── Worker ───────────────────────────────────────────────────────────────────
  # A web service rather than a background worker because Slack posts merge clicks
  # to it (/slack/interactions); /health and /status report the queue.
  - type: web
    name: pager-worker
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r --filter './packages/**' build
    startCommand: pnpm --filter @pager/worker start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - fromGroup: pager-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: pager-db
          property: connectionString
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      # Verifies merge clicks. Without it no merge button is offered.
      - key: SLACK_SIGNING_SECRET
        sync: false
      # Optional: the operator's model key, for workspaces that bring none. Their
      # spend is capped at the plan's included amount unless they set a budget.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAGER_MODEL
        value: claude-opus-5
      - key: PAGER_WORKER_CONCURRENCY
        value: "2"
      - key: PAGER_MAX_RUNNING_JOBS
        value: "4"
      # Render runs no Docker daemon, so the container sandbox is unavailable here
      # and repository code (tests, patches) runs as a child process of the worker.
      # That is acceptable for repositories you own; it is NOT isolation between
      # tenants. For untrusted workspaces, run the worker on a host with a Docker
      # daemon and set PAGER_SANDBOX_RUNNER=docker.
      - key: PAGER_SANDBOX_RUNNER
        value: local
